# Conda environment for Spatial Biology Workshop
# =============================================
#
# Create environment:
#   conda env create -f environment.yml
#
# Activate:
#   conda activate spatial-biology
#
# Update:
#   conda env update -f environment.yml
#

name: spatial-biology
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.11
  - pip>=23.0

  # Scientific computing
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0

  # Single-cell analysis
  - scanpy>=1.9.6
  - anndata>=0.10

  # Spatial analysis
  - squidpy>=1.3

  # Machine learning
  - scikit-learn>=1.3

  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.12

  # Jupyter
  - jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets

  # Utilities
  - tqdm
  - joblib

  # pip-only packages
  - pip:
    - lifelines>=0.27  # Survival analysis
    - statsmodels>=0.14  # Statistical models

# Notes:
# ------
# - Total install size: ~2 GB
# - First-time setup: ~5-10 minutes
# - Tested on Linux and macOS
# - Windows: Use WSL2 for best compatibility
